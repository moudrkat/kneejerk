ext {
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply plugin: 'com.android.library'

// Two ways to get libkneejerk_jni.so. Inside a kneejerk checkout (or with kneejerkRoot set in gradle.properties)
// it is compiled from source together with llama.cpp. Installed from npm there are no sources, and the package
// carries the library built for arm64-v8a in android/prebuilt/.
def kneejerkRootDir = (project.hasProperty('kneejerkRoot') ? file(project.kneejerkRoot) : file('../../..')).canonicalPath
def kneejerkFromSource = new File(kneejerkRootDir, 'src/systemone.cpp').exists() && new File(kneejerkRootDir, 'CMakeLists.txt').exists()

android {
    namespace = "com.moudrkat.kneejerk"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    ndkVersion = project.hasProperty('ndkVersion') ? rootProject.ext.ndkVersion : "27.2.12479018"
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        ndk {
            // 64-bit ARM only: a 2B model does not fit a 32-bit process, and every phone since 2017 is arm64
            abiFilters 'arm64-v8a'
        }
        if (kneejerkFromSource) {
            externalNativeBuild {
                cmake {
                    arguments "-DANDROID_STL=c++_shared",
                              "-DCMAKE_BUILD_TYPE=Release",                  // llama.cpp at -O0 is unusable, even in a debug app
                              "-DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16",  // 2018+ phones; no i8mm, older Pixels lack it
                              "-DKNEEJERK_ROOT=${kneejerkRootDir}"
                    // no build-machine paths in the binary: llama.cpp's asserts and logs carry __FILE__
                    cFlags "-ffile-prefix-map=${kneejerkRootDir}=."
                    cppFlags "-std=c++17", "-ffile-prefix-map=${kneejerkRootDir}=."
                }
            }
        }
    }
    if (kneejerkFromSource) {
        externalNativeBuild {
            cmake {
                path "src/main/cpp/CMakeLists.txt"
                version "3.22.1+"
            }
        }
    } else {
        // installed from npm: no kneejerk checkout next to the plugin, so the library comes ready-made
        sourceSets {
            main {
                jniLibs.srcDirs = ['prebuilt']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
}

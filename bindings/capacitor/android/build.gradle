ext {
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "com.moudrkat.kneejerk"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    ndkVersion = project.hasProperty('ndkVersion') ? rootProject.ext.ndkVersion : "27.2.12479018"
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        ndk {
            // 64-bit ARM only: a 2B model does not fit a 32-bit process, and every phone since 2017 is arm64
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                          "-DCMAKE_BUILD_TYPE=Release",                  // llama.cpp at -O0 is unusable, even in a debug app
                          "-DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16",  // 2018+ phones; no i8mm, older Pixels lack it
                          "-DKNEEJERK_ROOT=${project.hasProperty('kneejerkRoot') ? project.kneejerkRoot : file('../../..').absolutePath}"
                // no build-machine paths in the binary: llama.cpp's asserts and logs carry __FILE__
                def repoRoot = rootProject.file("${projectDir}/../../..").canonicalPath
                cFlags "-ffile-prefix-map=${repoRoot}=."
                cppFlags "-std=c++17", "-ffile-prefix-map=${repoRoot}=."
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1+"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
}
